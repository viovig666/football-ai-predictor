# fly.toml — FootPredict AI on Fly.io
# Place in: /home/viovig/cd/football-ai-predictor/fly.toml
#
# Deploy:
#   1. fly launch --no-deploy  (inside the project dir)
#   2. fly secrets set FOOTBALL_DATA_API_KEY="..."
#      fly secrets set API_FOOTBALL_KEY="..."
#   3. fly deploy
#
# Docs:  https://fly.io/docs/reference/configuration/

app = "football-ai-predictor"

[build]
  builder = "docker"
  dockerfile = "Dockerfile"

[deploy]
  release_command = "python -c \"from ai.predictor import FootballPredictor; FootballPredictor()\""
  restart_limit = 10

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# SQLite data persistence (survives reboots)
[[mounts]]
  source = "footpredict_data"
  destination = "/app/data"

[env]
  PORT = "8080"
