# fly.toml — FootPredict AI on Fly.io
# Uses Nixpacks (no Docker needed — Fly.io builds in the cloud)

app = "football-ai-predictor"

[build]
  builder = "docker"
  dockerfile = "Dockerfile"

[deploy]
  release_command = "echo 'Models will train on first boot'"
  restart_limit = 10

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# SQLite data persistence
[[mounts]]
  source = "footpredict_data"
  destination = "/app/data"

[env]
  PORT = "8080"
